# Cloud Build Configuration for CineVibe
# Builds and deploys all services to Google Cloud Run

substitutions:
  _REGION: 'us-central1'
  _REPO: 'cinevibe'

steps:
  # Run Tests
  - name: 'python:3.12-slim'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        pytest tests/ -v --cov=. --cov-report=xml

  # Build Director Agent
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-director'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/director:$COMMIT_SHA', '-f', 'Dockerfile.director', '.']
    waitFor: ['test']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-director'
    args:
      - 'run'
      - 'deploy'
      - 'cinevibe-director'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/director:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    waitFor: ['build-director']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/director:$COMMIT_SHA'

timeout: '1800s'
