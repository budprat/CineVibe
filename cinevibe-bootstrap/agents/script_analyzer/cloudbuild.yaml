steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/script-analyzer:${SHORT_SHA}', '.']
    dir: 'agents/script_analyzer'
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/script-analyzer:${SHORT_SHA}']
  
  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 
           '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/script-analyzer:${SHORT_SHA}',
           '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/script-analyzer:latest']
  
  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/script-analyzer:latest']

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: cinevibe-agents

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'